name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches:
      - claude/showtrack-tv-tracker-27fepl
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish (and auto-enable) Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Supabase: enables accounts + cloud sync, and routes TMDB/OMDb through
          # the Edge Function proxy so NO TMDB/OMDb key ships in the browser.
          # The URL and anon key are public by design (protected by RLS policies).
          VITE_SUPABASE_URL: 'https://ahibgeazsfftwzlzytah.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoaWJnZWF6c2ZmdHd6bHp5dGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MTQ2MTksImV4cCI6MjA5OTA5MDYxOX0.sDux7501kvM_6ECYT4Xct7l_FSbpb6oLcimj3h6-MOU'

      # Creates the Pages site automatically if it doesn't exist yet.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
