name: Nightly refresh

on:
  # IMDb publishes a new dataset every day; pick it up each morning (UTC).
  schedule:
    - cron: '30 5 * * *'
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
    inputs:
      min_votes:
        description: 'Vote floor for titles to mirror'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  # Two things must happen every day even if the IMDb refresh breaks:
  #  - GitHub switches off scheduled workflows in a repo with no commits for
  #    60 days; re-enabling this workflow through the API resets that timer.
  #  - Supabase pauses a free project after 7 days without requests, which
  #    takes sign-in and sync down with it. A couple of cheap reads keep it up.
  # This job has no dependencies and no concurrency group on purpose: a run
  # stuck in "queued" in a shared group once blocked every later run for weeks
  # (the file was renamed from refresh-imdb-ratings.yml to escape it).
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep this scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/nightly-refresh.yml/enable" || echo "::warning::could not re-enable workflow"

      - name: Keep the Supabase project awake
        env:
          SUPABASE_URL: https://ahibgeazsfftwzlzytah.supabase.co
          # Public by design (it is shipped in the site); RLS protects the data.
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoaWJnZWF6c2ZmdHd6bHp5dGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MTQ2MTksImV4cCI6MjA5OTA5MDYxOX0.sDux7501kvM_6ECYT4Xct7l_FSbpb6oLcimj3h6-MOU
        run: |
          set -u
          for path in "auth/v1/health" "rest/v1/imdb_ratings?select=tconst&limit=1"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "$SUPABASE_URL/$path" -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Supabase answered $code for $path — the project may be paused. Restore it from the Supabase dashboard."
              exit 1
            fi
          done

  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One refresh at a time; a newer run replaces a waiting one.
    concurrency:
      group: nightly-imdb-refresh
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh imdb_ratings from the official IMDb dataset
        env:
          SUPABASE_URL: https://ahibgeazsfftwzlzytah.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_VOTES: ${{ github.event.inputs.min_votes || '50' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          node scripts/refresh-imdb-ratings.mjs

      - name: Pre-warm TMDB -> IMDb id mappings for browsable titles
        env:
          SUPABASE_URL: https://ahibgeazsfftwzlzytah.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_PROXY: https://ahibgeazsfftwzlzytah.supabase.co/functions/v1/api
          WARM_PAGES: '10'
        run: node scripts/warm-imdb-mappings.mjs
